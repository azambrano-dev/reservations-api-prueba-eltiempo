; Ajustes de desarrollo. No usar tal cual en produccion.

memory_limit = 512M
max_execution_time = 120

display_errors = On
error_reporting = E_ALL
log_errors = On

; El script de concurrencia usa pcntl_fork y sleep(); sin esto el
; time limit del CLI puede cortar la ventana de carrera para la prueba.
max_input_time = 120

date.timezone = America/Bogota

; Deshabilitamos en desarrollo para que los cambios de codigo se reflejen
; sin reiniciar php-fpm.
opcache.enable = 0
opcache.enable_cli = 0
